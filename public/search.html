<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Поиск — Beltelecom Shop</title>
  <link rel="icon" href="/assets/system/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-active="search.html">
  <div id="shell-header"></div>

  <main id="main" class="page-search">
    <section class="page-hero page-hero--compact">
      <h1>Поиск товаров</h1>
      <p class="page-hero__lead">Найдите смартфон, технику и аксессуары по названию или описанию.</p>
      <form class="search-page-form" action="search.html" method="get">
        <div class="search-page-form__field">
          <input type="search" name="q" id="search-q" placeholder="Например: Samsung, 4K, наушники…" autocomplete="off" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggest-list" />
          <div id="search-suggest-list" class="search-suggest" role="listbox" hidden></div>
        </div>
        <button type="submit" class="cta-button cta-button--solid">Искать</button>
      </form>
    </section>
    <div id="search-results" class="product-grid"></div>
    <p id="search-status" class="search-status"></p>
  </main>

  <div id="shell-footer"></div>
  <script src="js/core/auth.js"></script>
  <script src="js/core/cart.js"></script>
  <script src="js/core/site-shell.js"></script>
  <script src="js/pages/pages-search.js"></script>
</body>
</html>
